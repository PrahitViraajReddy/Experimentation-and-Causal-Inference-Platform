services:
  - type: web
    name: experimentation-causal-api
    runtime: python
    rootDir: backend
    branch: feat/statistical-platform-foundation
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
